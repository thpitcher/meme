<!DOCTYPE html>
<html>
<head>
  <title>Random Meme Generator</title>
</head>
<body>
  <h1>Random Meme</h1>
  <button onclick="getMeme()">Get Meme</button>
  <h2 id="memeTitle"></h2>
  <img id="memeImg" src="" width="400" />

  <script>
    function getMeme() {
      fetch('https://meme-api.com/gimme')
        .then(res => res.json())
        .then(data => {
          document.getElementById('memeTitle').innerText = data.title;
          document.getElementById('memeImg').src = data.url;
        });
    }
  </script>
</body>
</html>
